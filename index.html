<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premium Collection ✨</title>
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#fff;position:sticky;top:0;z-index:10}
.logo{color:#e91e63;font-weight:bold;font-size:22px}
.cart-btn{background:#111;color:#fff;padding:8px 16px;border-radius:20px;border:none}
.banner{background:linear-gradient(to right,#e91e63,#9c27b0);color:#fff;text-align:center;padding:25px 10px}
.banner h1{margin:0;font-size:28px;line-height:1.2}
.banner p{margin:5px 0 0;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:220px;object-fit:cover}
.card-body{padding:10px}
.card-title{font-weight:bold;font-size:15px;height:40px;overflow:hidden}
.price{color:#e91e63;font-weight:bold;font-size:18px;margin:6px 0}
.old{color:gray;text-decoration:line-through;font-size:13px;margin-left:5px}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-cart{flex:1;background:#fff;border:1.5px solid #000;border-radius:10px;padding:10px 2px;font-weight:bold}
.btn-buy{flex:1;background:#e91e63;color:#fff;border:none;border-radius:10px;padding:10px 2px;font-weight:bold}
#orderModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0008;z-index:100;align-items:center;justify-content:center}
.modal{background:#fff;width:90%;max-width:350px;border-radius:15px;padding:20px}
.modal input,.modal textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.modal button{width:100%;background:#e91e63;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:bold;margin-top:10px;font-size:16px}
</style>
</head>
<body>
<div class="top">
<div class="logo">Premium Collection ✨</div>
<button class="cart-btn">🛒 Cart (<span id="cartCount">0</span>)</button>
</div>
<div class="banner">
<h1>Meesho Style Sale - 50% OFF</h1>
<p>Free Delivery + COD</p>
</div>
<div class="grid" id="grid"></div>

<div id="orderModal">
<div class="modal">
<h3 style="margin:0;text-align:center">Order Details Bhara</h3>
<input id="cName" placeholder="Tumcha Nav">
<input id="cMobile" placeholder="Mobile Number" type="number">
<textarea id="cAddr" placeholder="Full Address - Gaav, Taluka, Pincode"></textarea>
<p id="selProd" style="font-weight:bold;color:#e91e63"></p>
<button onclick="placeOrder()">Order Confirm Kara ✅</button>
<button onclick="closeModal()" style="background:#ddd;color:#000;margin-top:8px">Cancel</button>
</div>
</div>

<script>
let defaultProducts=[
{name:"Women Trendy Kurta Set",price:"599",oldprice:"1299",img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400",cat:"Women"},
{name:"Men Oversized T-Shirt",price:"399",oldprice:"799",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",cat:"Men"},
{name:"Designer Saree",price:"899",oldprice:"1999",img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400",cat:"Saree"},
{name:"Kids Casual Wear",price:"499",oldprice:"999",img:"https://images.unsplash.com/photo-1503919545889-aef636e10ad4?w=400",cat:"Kids"},
{name:"Kundan Jewellery Set",price:"349",oldprice:"999",img:"https://images.unsplash.com/photo-1603561596112-0a132b757442?w=400",cat:"Jewellery"},
{name:"Luxury Black Watch",price:"599",oldprice:"1499",img:"https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=400",cat:"Watches"}
];
let allProducts=[...defaultProducts];
let selectedProd=null;
let grid=document.getElementById('grid');
function render(){
grid.innerHTML="";
allProducts.forEach((p,i)=>{
let div=document.createElement('div');
div.className="card";
div.innerHTML=`<img src="${p.img}"><div class="card-body"><div class="card-title">${p.name}</div><div class="price">₹${p.price}<span class="old">₹${p.oldprice}</span></div><div class="btn-row"><button class="btn-cart">Add to Cart</button><button class="btn-buy" onclick="openModal(${i})">BUY NOW</button></div></div>`;
grid.appendChild(div);
});
}
function openModal(i){
selectedProd=allProducts[i];
document.getElementById('selProd').innerText=selectedProd.name+" - Rs."+selectedProd.price;
document.getElementById('orderModal').style.display='flex';
}
function closeModal(){document.getElementById('orderModal').style.display='none';}
function placeOrder(){
let name=document.getElementById('cName').value;
let mobile=document.getElementById('cMobile').value;
let addr=document.getElementById('cAddr').value;
if(!name||!mobile||!addr){alert('Sagla bhara dada!');return;}
let orders=JSON.parse(localStorage.getItem('orders')||'[]');
let order={
id:Math.floor(10000+Math.random()*90000),
product:selectedProd.name,
price:selectedProd.price,
customerName:name,
mobile:mobile,
address:addr,
date:new Date().toLocaleString(),
status:"Pending"
};
orders.push(order);
localStorage.setItem('orders',JSON.stringify(orders));
alert('Order Success! ✅ Admin panel madhe bagh');
closeModal();
document.getElementById('cName').value='';
document.getElementById('cMobile').value='';
document.getElementById('cAddr').value='';
}
render();
</script>
</body>
</html>
