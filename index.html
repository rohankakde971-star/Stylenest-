<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StyleNest - Jewellery & Watches</title>
<style>
body{font-family:sans-serif;margin:0;background:#fff5f8}
.header{background:#000;color:#fff;padding:15px;text-align:center;font-size:20px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;padding:10px;border-radius:12px;box-shadow:0 2px 8px #0001;text-align:center}
.card img{width:100%;border-radius:8px;height:150px;object-fit:cover}
.cat{font-size:10px;background:#000;color:#fff;padding:2px 8px;border-radius:20px}
.price{font-weight:bold;margin:5px 0}
.old{color:gray;text-decoration:line-through;font-size:12px}
.btn{width:100%;padding:8px;background:#000;color:#fff;border:none;border-radius:6px;margin-top:5px}
</style>
</head>
<body>
<div class="header">StyleNest - Premium Collection 💍⌚</div>
<div class="grid" id="grid"></div>

<div id="orderModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0008;padding:20px;box-sizing:border-box">
<div style="background:#fff;padding:20px;border-radius:10px;margin-top:100px">
<h3 id="pname">Product</h3>
<input id="cname" placeholder="Tumcha Naav" style="width:100%;padding:10px;margin:5px 0">
<input id="caddr" placeholder="Address" style="width:100%;padding:10px;margin:5px 0">
<button onclick="orderNow()" style="width:100%;padding:12px;background:#25D366;color:#fff;border:none;border-radius:6px">Order on WhatsApp</button>
<button onclick="document.getElementById('orderModal').style.display='none'" style="width:100%;padding:8px;background:#ccc;border:none;margin-top:5px;border-radius:6px">Close</button>
</div>
</div>

<script>
let defaultProducts = [
 {cat:"Jewellery",name:"Kundan Choker Set",price:"349",oldprice:"999",img:"https://via.placeholder.com/300x300?text=Jewellery"},
 {cat:"Watches",name:"Premium Black Watch",price:"599",oldprice:"1499",img:"https://via.placeholder.com/300x300?text=Watch"}
];
let adminPros = JSON.parse(localStorage.getItem('myProducts')||'[]');
let all = [...adminPros.reverse(), ...defaultProducts];
let grid = document.getElementById('grid');
grid.innerHTML="";
all.forEach(p=>{
 let d=document.createElement('div');
 d.className="card";
 d.innerHTML=`<span class="cat">${p.cat}</span><img src="${p.img}"><h4 style="margin:6px 0;font-size:14px">${p.name}</h4><div class="price">₹${p.price} <span class="old">₹${p.oldprice}</span></div><button class="btn" onclick="openOrder('${p.name}')">Order Now</button>`;
 grid.appendChild(d);
});
function openOrder(n){document.getElementById('pname').innerText=n;document.getElementById('orderModal').style.display='block';}
function orderNow(){
 let pn=document.getElementById('pname').innerText;
 let cn=document.getElementById('cname').value;
 let ca=document.getElementById('caddr').value;
 let msg=`Hi, mala ${pn} pahije. Name: ${cn}, Address: ${ca}`;
 window.open(`https://wa.me/919876543210?text=${encodeURIComponent(msg)}`,'_blank');
}
</script>
</body>
</html>
