<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleNest971 - Flipkart Style Store</title>
<style>
body{font-family:Roboto,Arial;margin:0;background:#f1f3f6}
.header{background:#2874f0;color:white;padding:12px 20px;font-weight:bold;font-size:20px}
.container{display:flex;flex-wrap:wrap;max-width:1100px;margin:10px auto;background:white;padding:15px;border-radius:8px}
.left{flex:1;min-width:300px;text-align:center}
.right{flex:1;min-width:300px;padding:15px}
.img{width:90%;border:1px solid #eee;border-radius:8px}
.price{font-size:28px;font-weight:bold}
.mrp{color:gray;text-decoration:line-through;margin-left:10px}
.off{color:green;margin-left:10px;font-weight:bold}
.btn{width:100%;padding:16px;font-size:18px;font-weight:bold;border:none;border-radius:8px;margin-top:10px;cursor:pointer}
.btn-cart{background:#ff9f00;color:white}
.btn-buy{background:#fb641b;color:white}
.input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
</style>
</head>
<body>
<div class="header">StyleNest971</div>
<div class="container">
  <div class="left">
    <img class="img" src="https://via.placeholder.com/400x500?text=Upload+Your+Product+Photo">
    <div style="background:#e8f5e9;padding:10px;border-radius:6px;margin-top:10px">✅ COD | ✅ Free Delivery | ✅ Easy Return</div>
  </div>
  <div class="right">
    <h2>Stylish Product - Meesho Best Seller</h2>
    <div><span class="price">₹599</span><span class="mrp">₹1299</span><span class="off">53% OFF</span></div>
    <p style="color:green;font-weight:bold">✓ In Stock</p>
    <h3>Delivery Details</h3>
    <input class="input" id="cName" placeholder="Tumcha Purn Naav">
    <input class="input" id="cMobile" placeholder="Mobile Number">
    <textarea class="input" id="cAddr" placeholder="Purn Address + Pin Code"></textarea>
    <button class="btn btn-cart" onclick="alert('Cart madhe add zala!')">ADD TO CART</button>
    <button class="btn btn-buy" onclick="orderOnWhatsApp()">PLACE ORDER - WhatsApp</button>
  </div>
</div>
<script>
function orderOnWhatsApp(){
  let name=document.getElementById('cName').value;
  let mobile=document.getElementById('cMobile').value;
  let addr=document.getElementById('cAddr').value;
  if(name.length<3){alert('Naav taka');return;}
  if(mobile.length<10){alert('Mobile taka');return;}
  if(addr.length<10){alert('Address taka');return;}
  let msg=`*NEW ORDER - StyleNest971*%0AProduct: Stylish Product%0APrice: Rs.599%0A%0ACustomer: ${name}%0AMobile: ${mobile}%0AAddress: ${addr}%0A%0APayment: COD`;
  window.open(`https://wa.me/917219384469?text=${msg}`,'_blank');
}
</script>
</body>
</html>
