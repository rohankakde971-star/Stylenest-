<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StyleNest</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}header{background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:12px 16px;display:flex;justify-content:space-between}.logo{font-weight:800;font-size:22px;color:#e91e63}.cart-btn{background:#111;color:#fff;padding:8px 16px;border-radius:20px;border:none;font-weight:600}.banner{background:linear-gradient(135deg,#e91e63,#9c27b0);color:#fff;padding:24px;text-align:center}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}.card img{width:100%;height:180px;object-fit:cover}.card-body{padding:10px}.price{color:#e91e63;font-weight:700}.mrp{color:#888;font-size:12px;text-decoration:line-through;margin-left:6px}.btn-row{display:flex;gap:6px;margin-top:8px}.btn{flex:1;padding:8px;border-radius:8px;border:none;font-weight:700;font-size:13px}.btn-cart{background:#fff;border:1.5px solid #111}.btn-buy{background:#e91e63;color:#fff}#checkout{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:100;overflow:auto}.checkout-box{background:#fff;max-width:480px;margin:20px auto;border-radius:16px;padding:20px}.input{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:8px;margin:8px 0}.pay-opt{border:1.5px solid #ddd;padding:12px;border-radius:8px;margin:6px 0;display:flex;gap:10px}.pay-opt.active{border-color:#e91e63;background:#fff0f5}.order-btn{width:100%;background:#e91e63;color:#fff;padding:14px;border:none;border-radius:10px;font-weight:800;margin-top:12px}</style></head><body><header><div class="logo">StyleNest ✨</div><button class="cart-btn" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button></header><div class="banner"><h1>Meesho Style Sale - 50% OFF</h1><p>Free Delivery + COD</p></div><div class="products" id="products"></div><div id="checkout"><div class="checkout-box"><h2>Checkout</h2><div id="orderSummary" style="background:#f9fafb;padding:12px;border-radius:8px;margin:12px 0;font-size:14px"></div><input class="input" id="custName" placeholder="Full Name *"><input class="input" id="custPhone" placeholder="Mobile Number *"><input class="input" id="custAddr" placeholder="Full Address with Pincode *"><b>Payment</b><div class="pay-opt active" onclick="selectPay(this,'COD')"><input type="radio" checked> Cash on Delivery</div><div class="pay-opt" onclick="selectPay(this,'UPI')"><input type="radio"> UPI / GPay</div><div class="pay-opt" onclick="selectPay(this,'WhatsApp')"><input type="radio"> WhatsApp Order</div><button class="order-btn" onclick="placeOrder()">PLACE ORDER - BUY NOW</button><button style="width:100%;margin-top:8px;padding:10px;background:#eee;border:none;border-radius:8px" onclick="closeCheckout()">Cancel</button></div></div><script>const products=[{id:1,name:"Women Trendy Kurta Set",price:599,mrp:1299,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400"},{id:2,name:"Men Oversized T-Shirt",price:399,mrp:799,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},{id:3,name:"Saree Georgette Party Wear",price:749,mrp:1599,img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400"},{id:4,name:"Kids Ethnic Dress",price:499,mrp:999,img:"https://images.unsplash.com/photo-1503944583220-79d8926ad5e2?w=400"},{id:5,name:"Women Jeans High Waist",price:699,mrp:1399,img:"https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=400"},{id:6,name:"Men Formal Shirt",price:549,mrp:1099,img:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=400"}];let cart=[];let currentProduct=null;let payMethod='COD';const list=document.getElementById('products');products.forEach(p=>{list.innerHTML+=`<div class="card"><img src="${p.img}"><div class="card-body"><h3 style="font-size:14px;height:36px;overflow:hidden">${p.name}</h3><div><span class="price">₹${p.price}</span><span class="mrp">₹${p.mrp}</span></div><div class="btn-row"><button class="btn btn-cart" onclick="addToCart(${p.id})">Add to Cart</button><button class="btn btn-buy" onclick="buyNow(${p.id})">BUY NOW</button></div></div></div>`;});function addToCart(id){const p=products.find(x=>x.id===id);cart.push(p);document.getElementById('cartCount').innerText=cart.length;alert('Added to Cart!');}function buyNow(id){currentProduct=products.find(x=>x.id===id);showCheckout([currentProduct]);}function openCart(){if(cart.length===0){alert('Cart empty!');return;}showCheckout(cart);}function showCheckout(items){let total=items.reduce((s,i)=>s+i.price,0);document.getElementById('orderSummary').innerHTML=items.map(i=>`• ${i.name} - ₹${i.price}`).join('<br>')+`<br><br><b>Total: ₹${total} + Free Delivery</b>`;document.getElementById('checkout').style.display='block';}function closeCheckout(){document.getElementById('checkout').style.display='none';}function selectPay(el,m){document.querySelectorAll('.pay-opt').forEach(e=>{e.classList.remove('active');e.querySelector('input').checked=false});el.classList.add('active');el.querySelector('input').checked=true;payMethod=m;}function placeOrder(){let name=document.getElementById('custName').value;let phone=document.getElementById('custPhone').value;let addr=document.getElementById('custAddr').value;if(!name||!phone||!addr){alert('Fill all fields!');return;}let items=currentProduct?[currentProduct]:cart;let total=items.reduce((s,i)=>s+i.price,0);let msg=`*New StyleNest Order*%0AName: ${name}%0APhone: ${phone}%0AAddr: ${addr}%0AItems: ${items.map(i=>i.name).join(', ')}%0ATotal: Rs${total}%0APay: ${payMethod}`;if(payMethod==='WhatsApp'){window.open(`https://wa.me/91${phone}?text=${msg}`,'_blank');}else{alert(`Order Placed! Total ₹${total} - ${payMethod} - We will call ${phone}`);closeCheckout();cart=[];document.getElementById('cartCount').innerText=0;}}</script></body></html>
