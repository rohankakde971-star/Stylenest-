<script>
// Show Admin Products (Jewellery + Watches) on main website
let adminProducts = JSON.parse(localStorage.getItem('myProducts') || '[]');
let gridContainer = document.getElementById('grid');

if (gridContainer && adminProducts.length > 0) {
  adminProducts.reverse().forEach(p => {
    let card = document.createElement('div');
    card.style.cssText = "background:#fff;padding:10px;border-radius:10px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,0.1)";
    card.innerHTML = `
      <span style="background:#000;color:#fff;font-size:10px;padding:3px 8px;border-radius:20px">${p.cat}</span>
      <img src="${p.img}" style="width:100%;border-radius:8px;margin:6px 0">
      <h4 style="margin:5px 0">${p.name}</h4>
      <p style="margin:5px 0">₹${p.price} <s style="color:gray">₹${p.oldprice}</s></p>
      <button onclick="openOrder('${p.name}')" style="width:100%;padding:8px;background:#000;color:#fff;border:none;border-radius:5px">Order Now</button>
    `;
    gridContainer.prepend(card);
  });
}

function openOrder(name) {
  document.getElementById('pname').innerText = name;
  document.getElementById('orderModal').style.display = 'block';
}
</script>
</body>
