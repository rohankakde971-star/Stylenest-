
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel - StyleNest</title>
<style>
body{font-family:sans-serif;background:#f2f2f2;padding:15px}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 5px #0001}
input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:5px}
button{width:100%;padding:12px;background:#000;color:#fff;border:none;border-radius:5px;font-weight:bold}
img{width:100%;border-radius:5px}
.cat{font-size:11px;background:#000;color:#fff;padding:3px 8px;border-radius:10px}
</style>
</head>
<body>
<h2>🔐 StyleNest Admin (Phone)</h2>
<div class="card">
<h3>+ Navin Product Add Kar</h3>
<input type="file" id="pimg" accept="image/*">
<select id="pcat">
  <option value="Jewellery">💍 Jewellery</option>
  <option value="Watches">⌚ Watches</option>
  <option value="Saree">🥻 Saree</option>
  <option value="Beauty">💄 Beauty</option>
</select>
<input type="text" id="pname" placeholder="Product Naav - Ex: Kundan Set / Watch">
<input type="number" id="pprice" placeholder="Kimat - Ex: 349">
<input type="number" id="poldprice" placeholder="Juni Kimat - Ex: 699">
<button onclick="addProduct()">ADD PRODUCT ✅</button>
</div>
<div id="list"></div>

<script>
let products = JSON.parse(localStorage.getItem('myProducts') || '[]');
function addProduct(){
  const file = document.getElementById('pimg').files[0];
  if(!file){alert('Photo nivad!');return;}
  const reader = new FileReader();
  reader.onload = function(e){
    let obj = {
      img: e.target.result,
      cat: document.getElementById('pcat').value,
      name: document.getElementById('pname').value,
      price: document.getElementById('pprice').value,
      oldprice: document.getElementById('poldprice').value
    };
    products.push(obj);
    localStorage.setItem('myProducts', JSON.stringify(products));
    alert(obj.cat + ' Add Jhala! ✅');
    show();
  };
  reader.readAsDataURL(file);
}
function show(){
  let h='';
  products.forEach((p,i)=>{
    h+=`<div class="card"><span class="cat">${p.cat||'Product'}</span><img src="${p.img}"><h4>${p.name}</h4><p>₹${p.price} <s>₹${p.oldprice}</s></p><button onclick="del(${i})" style="background:red">DELETE</button></div>`;
  });
  document.getElementById('list').innerHTML=h;
}
function del(i){ if(confirm('Delete karu?')){ products.splice(i,1); localStorage.setItem('myProducts', JSON.stringify(products)); show(); } }
show();
</script>
</body>
</html>
