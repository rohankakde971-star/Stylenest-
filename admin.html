<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StyleNest Admin</title>
<style>
body{margin:0; font-family: sans-serif; background:#f5f5f5}
.header{display:flex; justify-content:space-between; align-items:center; padding:12px 15px; background:#fff; border-bottom:1px solid #eee; position:sticky; top:0; z-index:10}
.header h2{margin:0; font-size:22px; font-family: serif}
.header h2 span{color:#ff3366}
.btn-black{background:#111; color:#fff; border:none; padding:8px 16px; border-radius:20px; font-weight:bold}
.btn-white{background:#fff; color:#000; border:1px solid #ddd; padding:8px 16px; border-radius:20px; font-weight:bold}
.tabs{display:flex; gap:10px; padding:12px}
.tab{flex:1; padding:12px; border-radius:25px; border:1px solid #ddd; background:#fff; font-weight:bold}
.tab.active{background:#111; color:#fff}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 12px}
.stat{background:#fff; border:1px solid #eee; border-radius:15px; padding:15px}
.stat p{margin:0; font-size:12px; color:gray; letter-spacing:1px; font-weight:bold}
.stat h1{margin:5px 0 0 0; font-size:28px}
.searchRow{display:flex; gap:10px; padding:12px}
.searchRow input, .searchRow select{flex:1; padding:12px; border-radius:25px; border:1px solid #ddd; background:#fff}
.card{background:#fff; border-radius:15px; padding:12px; margin:12px; border:1px solid #eee}
.card input, .card select{width:100%; padding:12px; margin:6px 0; border:1px solid #eee; border-radius:25px; box-sizing:border-box; background:#fff}
.addBtn{width:100%; background:#111; color:#fff; border:none; padding:14px; border-radius:25px; font-weight:bold; margin-top:10px}
.productItem{display:flex; gap:10px; align-items:center; background:#fff; margin:10px 12px; padding:10px; border-radius:15px; border:1px solid #eee}
.productItem img{width:60px; height:60px; border-radius:10px; object-fit:cover}
.delBtn{background:#ffe0e0; color:#c00; border:none; padding:8px 15px; border-radius:15px; font-weight:bold}
.sizeLabel{background:#eee; padding:5px 10px; border-radius:15px; font-size:12px; margin:2px; display:inline-block}
</style>
</head>
<body>

<div class="header">
  <h2>StyleNest<span>.</span> Admin</h2>
  <div style="display:flex; gap:8px">
    <button class="btn-black">↓ Excel</button>
    <button class="btn-white">Logout</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" id="tabOrders" onclick="showTab('orders')">Orders</button>
  <button class="tab" id="tabProducts" onclick="showTab('products')">Products</button>
</div>

<!-- ORDERS TAB - NO CHANGE -->
<div id="ordersSection">
  <div class="stats">
    <div class="stat"><p>TOTAL ORDERS</p><h1 id="totalOrders">1</h1></div>
    <div class="stat"><p>REVENUE</p><h1>₹<span id="rev">0</span></h1></div>
    <div class="stat"><p>PENDING</p><h1 id="pending">1</h1></div>
    <div class="stat"><p>DELIVERED</p><h1>0</h1></div>
  </div>
  <div class="searchRow">
    <input placeholder="Search Name/Mobile...">
    <select><option>All Status</option></select>
  </div>
  <div style="padding:0 12px"><button class="btn-white">🔄 Refresh</button></div>
  <div id="ordersList" style="padding:12px; color:gray; font-size:13px">Orders will show here...</div>
</div>

<!-- PRODUCTS TAB - UPDATED WITH 4 PHOTO + SIZE -->
<div id="productsSection" style="display:none">
  <div class="card">
    <input id="pName" placeholder="Product Name">
    <input id="pPrice" placeholder="Price" type="number">
    <input id="pOldPrice" placeholder="Old Price" type="number">
    <input id="pImageURL" placeholder="Image URL">

    <!-- NEW: 4 PHOTO UPLOAD - ADDED -->
    <div style="border:2px dashed #111; padding:12px; border-radius:15px; background:#fafafa; text-align:center; margin:8px 0">
      <input type="file" id="pFiles" accept="image/*" multiple hidden onchange="handleFiles(this)">
      <button type="button" onclick="document.getElementById('pFiles').click()" style="background:#111; color:#fff; padding:10px 15px; border-radius:20px; border:none; width:100%">📸 Select 4 Photos from Gallery</button>
      <div id="prevBox" style="display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; justify-content:center"></div>
      <input type="hidden" id="pAllImages">
    </div>

    <!-- NEW: SIZE - ADDED -->
    <div style="border:1px solid #ddd; padding:10px; border-radius:15px; margin:8px 0; background:#fff">
      <b style="font-size:13px">📏 Sizes (For Shirt/Pant/Shoes)</b><br>
      <small style="color:gray">Leave empty for Watches</small>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px" id="sizeOptions">
        <label class="sizeLabel"><input type="checkbox" class="sz" value="S"> S</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="M"> M</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="L"> L</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="XL"> XL</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="XXL"> XXL</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="28"> 28</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="30"> 30</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="32"> 32</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="34"> 34</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="36"> 36</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="6"> 6</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="7"> 7</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="8"> 8</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="9"> 9</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="10"> 10</label>
      </div>
      <input type="hidden" id="pSizes">
      <small id="sizeShow" style="color:green"></small>
    </div>

    <select id="pCat">
      <option value="Watches">Watches</option>
      <option value="Women">Women</option>
      <option value="Men">Men</option>
      <option value="Shirts">Shirts</option>
      <option value="Pants">Pants</option>
      <option value="Shoes">Shoes</option>
      <option value="Saree">Saree</option>
      <option value="Jewellery">Jewellery</option>
    </select>

    <button class="addBtn" onclick="addProduct()">+ Add Product</button>
  </div>

  <div id="productList"></div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('myProducts') || '[]');

function showTab(t){
  document.getElementById('ordersSection').style.display = t=='orders'?'block':'none';
  document.getElementById('productsSection').style.display = t=='products'?'block':'none';
  document.getElementById('tabOrders').className = t=='orders'?'tab active':'tab';
  document.getElementById('tabProducts').className = t=='products'?'tab active':'tab';
}

// 4 PHOTO LOGIC
let upImgs = [];
function handleFiles(inp){
  upImgs=[]; let box=document.getElementById('prevBox'); box.innerHTML='';
  Array.from(inp.files).slice(0,4).forEach(f=>{
    let r=new FileReader();
    r.onload=e=>{
      upImgs.push(e.target.result);
      box.innerHTML+=`<img src="${e.target.result}" style="width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid #ddd">`;
      document.getElementById('pAllImages').value=JSON.stringify(upImgs);
      if(!document.getElementById('pImageURL').value) document.getElementById('pImageURL').value=upImgs[0];
    }; r.readAsDataURL(f);
  });
}

// SIZE LOGIC
document.querySelectorAll('.sz').forEach(c=>c.addEventListener('change',()=>{
  let sel=[]; document.querySelectorAll('.sz:checked').forEach(x=>sel.push(x.value));
  document.getElementById('pSizes').value=JSON.stringify(sel);
  document.getElementById('sizeShow').innerText= sel.length ? 'Selected: '+sel.join(', ') : '';
}));

function addProduct(){
  let imgUrl = document.getElementById('pImageURL').value;
  let allImgs = JSON.parse(document.getElementById('pAllImages').value || '[]');
  if(!imgUrl && allImgs.length>0) imgUrl = allImgs[0];
  if(!imgUrl){ alert('Please add Image URL or select photos'); return; }

  let obj = {
    name: document.getElementById('pName').value,
    price: document.getElementById('pPrice').value,
    oldprice: document.getElementById('pOldPrice').value,
    img: imgUrl,
    imgs: allImgs.length? allImgs : [imgUrl],
    cat: document.getElementById('pCat').value,
    sizes: JSON.parse(document.getElementById('pSizes').value || '[]')
  };
  products.push(obj);
  localStorage.setItem('myProducts', JSON.stringify(products));
  alert('Product Added ✅');
  showProducts();
  // clear
  document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pOldPrice').value=''; document.getElementById('pImageURL').value=''; document.getElementById('pAllImages').value=''; document.getElementById('prevBox').innerHTML=''; document.getElementById('pSizes').value=''; document.querySelectorAll('.sz').forEach(c=>c.checked=false); document.getElementById('sizeShow').innerText='';
}

function showProducts(){
  let h='';
  products.slice().reverse().forEach((p,i)=>{
    let idx = products.length-1-i;
    h+=`<div class="productItem">
      <img src="${p.img}">
      <div style="flex:1"><b>${p.name}</b><br><span style="font-size:13px">₹${p.price} • ${p.cat} ${p.sizes && p.sizes.length? '• Size: '+p.sizes.join(',') : ''}</span></div>
      <button class="delBtn" onclick="delProd(${idx})">Delete</button>
    </div>`;
  });
  document.getElementById('productList').innerHTML=h;
  document.getElementById('totalOrders').innerText = products.length;
}
function delProd(i){ if(confirm('Delete?')){ products.splice(i,1); localStorage.setItem('myProducts', JSON.stringify(products)); showProducts(); } }
showProducts();
</script>
</body>
</html>
