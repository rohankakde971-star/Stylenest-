<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StyleNest Admin</title>
<style>
body{margin:0; font-family: sans-serif; background:#f5f5f5}
.header{display:flex; justify-content:space-between; align-items:center; padding:12px 15px; background:#fff; border-bottom:1px solid #eee; position:sticky; top:0; z-index:10}
.header h2{margin:0; font-size:22px; font-family: serif; line-height:1.1}
.header h2 span{color:#ff3366}
.btn-black{background:#111; color:#fff; border:none; padding:8px 16px; border-radius:20px; font-weight:bold}
.btn-white{background:#fff; color:#000; border:1px solid #ddd; padding:8px 16px; border-radius:20px; font-weight:bold}
.tabs{display:flex; gap:10px; padding:12px}
.tab{flex:1; padding:12px; border-radius:25px; border:1px solid #ddd; background:#fff; font-weight:bold}
.tab.active{background:#111; color:#fff}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 12px}
.stat{background:#fff; border:1px solid #eee; border-radius:15px; padding:15px}
.stat p{margin:0; font-size:11px; color:gray; letter-spacing:1px; font-weight:bold}
.stat h1{margin:5px 0 0 0; font-size:28px}
.searchRow{display:flex; gap:10px; padding:12px}
.searchRow input,.searchRow select{flex:1; padding:12px; border-radius:25px; border:1px solid #ddd; background:#fff}
.card{background:#fff; border-radius:15px; padding:12px; margin:12px; border:1px solid #eee}
.card input,.card select{width:100%; padding:12px; margin:6px 0; border:1px solid #eee; border-radius:25px; box-sizing:border-box; background:#fff}
.addBtn{width:100%; background:#111; color:#fff; border:none; padding:14px; border-radius:25px; font-weight:bold; margin-top:10px}
.productItem{display:flex; gap:10px; align-items:center; background:#fff; margin:10px 12px; padding:10px; border-radius:15px; border:1px solid #eee}
.productItem img{width:60px; height:60px; border-radius:10px; object-fit:cover}
.orderCard{background:#fff; border:1px solid #eee; border-radius:15px; padding:12px; margin:10px 0}
.delBtn{background:#ffe0e0; color:#c00; border:none; padding:8px 15px; border-radius:15px; font-weight:bold}
.sizeLabel{background:#eee; padding:5px 10px; border-radius:15px; font-size:12px; margin:2px; display:inline-block}
</style>
</head>
<body>
<div class="header"><h2>StyleNest.<br>Admin</h2><div style="display:flex; gap:8px"><button class="btn-black" onclick="downloadExcel()">↓ Excel</button><button class="btn-white" onclick="location.reload()">Logout</button></div></div>
<div class="tabs"><button class="tab active" id="tabOrders" onclick="showTab('orders')">Orders</button><button class="tab" id="tabProducts" onclick="showTab('products')">Products</button></div>
<div id="ordersSection">
  <div class="stats">
    <div class="stat"><p>TOTAL ORDERS</p><h1 id="totalOrders">0</h1></div>
    <div class="stat"><p>REVENUE</p><h1>₹<span id="rev">0</span></h1></div>
    <div class="stat"><p>PENDING</p><h1 id="pending">0</h1></div>
    <div class="stat"><p>DELIVERED</p><h1 id="delivered">0</h1></div>
  </div>
  <div class="searchRow">
    <input id="orderSearch" placeholder="Search Name/Mobile..." oninput="renderOrders()">
    <select id="statusFilter" onchange="renderOrders()">
      <option value="All">All Status</option>
      <option value="Pending">Pending</option>
      <option value="Delivered">Delivered</option>
    </select>
  </div>
  <div style="padding:0 12px"><button class="btn-white" onclick="loadOrders()">🔄 Refresh</button></div>
  <div id="ordersList" style="padding:12px"></div>
</div>
<div id="productsSection" style="display:none">
  <div class="card">
    <input id="pName" placeholder="Product Name">
    <input id="pPrice" placeholder="Price" type="number">
    <input id="pOldPrice" placeholder="Old Price" type="number">
    <input id="pImageURL" placeholder="Image URL (optional if you select gallery)">
    <div style="border:2px dashed #111; padding:12px; border-radius:15px; background:#fafafa; text-align:center; margin:8px 0">
      <input type="file" id="pFiles" accept="image/*" multiple hidden onchange="handleFiles(this)">
      <button type="button" onclick="document.getElementById('pFiles').click()" style="background:#111; color:#fff; padding:10px 15px; border-radius:20px; border:none; width:100%">📸 Select 4 Photos from Gallery</button>
      <div id="prevBox" style="display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; justify-content:center"></div>
      <input type="hidden" id="pAllImages">
    </div>
    <div style="border:1px solid #ddd; padding:10px; border-radius:15px; margin:8px 0; background:#fff">
      <b style="font-size:13px">📏 Sizes (Shirt/Pant/Shoes)</b><br><small style="color:gray">Watches sathi blank theva</small>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px">
        <label class="sizeLabel"><input type="checkbox" class="sz" value="S"> S</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="M"> M</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="L"> L</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="XL"> XL</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="XXL"> XXL</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="28"> 28</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="30"> 30</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="32"> 32</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="34"> 34</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="36"> 36</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="6"> 6</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="7"> 7</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="8"> 8</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="9"> 9</label>
        <label class="sizeLabel"><input type="checkbox" class="sz" value="10"> 10</label>
      </div>
      <input type="hidden" id="pSizes"><small id="sizeShow" style="color:green"></small>
    </div>
    <select id="pCat"><option>Watches</option><option>Women</option><option>Men</option><option>Shirts</option><option>Pants</option><option>Shoes</option><option>Saree</option><option>Jewellery</option></select>
    <button class="addBtn" onclick="addProduct()">+ Add Product</button>
  </div>
  <div id="productList"></div>
</div>
<script>
let allOrdersData = [];
let products = JSON.parse(localStorage.getItem('myProducts') || localStorage.getItem('stylenest_products') || '[]');
function showTab(t){
  document.getElementById('ordersSection').style.display=t=='orders'?'block':'none';
  document.getElementById('productsSection').style.display=t=='products'?'block':'none';
  document.getElementById('tabOrders').className=t=='orders'?'tab active':'tab';
  document.getElementById('tabProducts').className=t=='products'?'tab active':'tab';
}
function loadOrders(){
  allOrdersData = [];
  let keys = ['orders','stylenest_orders','myOrders','StyleNestOrders','est971_orders'];
  keys.forEach(k=>{
    try{
      let d = localStorage.getItem(k);
      if(d){ let arr=JSON.parse(d); if(Array.isArray(arr)) allOrdersData=allOrdersData.concat(arr); else if(arr && arr.name) allOrdersData.push(arr); }
    }catch(e){}
  });
  // EXTRA CHECK - all localStorage keys with 'order'
  Object.keys(localStorage).forEach(k=>{
    if(k.toLowerCase().includes('order') &&!keys.includes(k)){
      try{ let arr=JSON.parse(localStorage.getItem(k)); if(Array.isArray(arr)) allOrdersData=allOrdersData.concat(arr); }catch(e){}
    }
  });
  renderOrders();
}
function renderOrders(){
  let search = (document.getElementById('orderSearch').value||'').toLowerCase();
  let statusF = document.getElementById('statusFilter').value;
  let box = document.getElementById('ordersList');
  // FIX - Correct text search
  let filtered = allOrdersData.filter(o=>{
    let txt = ((o.name||'') + ' ' + (o.mobile||o.phone||'') + ' ' + (o.product||o.productName||'')).toLowerCase();
    let okSearch = search==='' || txt.includes(search);
    let okStatus = statusF==='All' || (o.status||'Pending')===statusF;
    return okSearch && okStatus;
  });
  if(filtered.length==0){
    box.innerHTML = `<div style="text-align:center; padding:20px; color:gray; background:#fff; border-radius:12px">Orders will show here...<br>Total Found: ${allOrdersData.length}</div>`;
  } else {
    let html='';
    filtered.slice().reverse().forEach(o=>{
      html+=`<div class="orderCard"><b>${o.name||'Customer'}</b> - ${o.mobile||o.phone||''}<br><small>${o.address||''}</small><br><div style="margin:6px 0"><b>Product:</b> ${o.product||o.productName||''} ${o.size?' | Size:'+o.size:''}<br><b>₹${o.total||o.price||''}</b></div><small style="color:gray">${o.date||new Date().toLocaleString()} | Status: ${o.status||'Pending'}</small></div>`;
    });
    box.innerHTML=html;
  }
  document.getElementById('totalOrders').innerText=allOrdersData.length;
  document.getElementById('pending').innerText=allOrdersData.filter(o=>(o.status||'Pending')=='Pending').length;
  document.getElementById('delivered').innerText=allOrdersData.filter(o=>o.status=='Delivered').length;
  let rev=0; allOrdersData.forEach(o=>rev+=Number(o.total||o.price||0));
  document.getElementById('rev').innerText=rev;
}
function downloadExcel(){
  if(allOrdersData.length==0){ alert('No orders to export'); return; }
  let csv = 'Name,Mobile,Address,Product,Size,Total,Date,Status\n';
  allOrdersData.forEach(o=>{ csv+=`"${o.name||''}","${o.mobile||o.phone||''}","${o.address||''}","${o.product||''}","${o.size||''}","${o.total||''}","${o.date||''}","${o.status||'Pending'}"\n`; });
  let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='orders.csv'; a.click();
}
let upImgs=[];
function handleFiles(inp){
  upImgs=[]; let box=document.getElementById('prevBox'); box.innerHTML='';
  Array.from(inp.files).slice(0,4).forEach(f=>{
    let r=new FileReader(); r.onload=e=>{
      upImgs.push(e.target.result); box.innerHTML+=`<img src="${e.target.result}" style="width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid #ddd">`;
      document.getElementById('pAllImages').value=JSON.stringify(upImgs);
      if(!document.getElementById('pImageURL').value) document.getElementById('pImageURL').value=upImgs[0];
    }; r.readAsDataURL(f);
  });
}
document.querySelectorAll('.sz').forEach(c=>c.addEventListener('change',()=>{
  let sel=[]; document.querySelectorAll('.sz:checked').forEach(x=>sel.push(x.value));
  document.getElementById('pSizes').value=JSON.stringify(sel);
  document.getElementById('sizeShow').innerText= sel.length?'Selected: '+sel.join(', '):'';
}));
function addProduct(){
  let imgUrl=document.getElementById('pImageURL').value;
  let allImgs=JSON.parse(document.getElementById('pAllImages').value||'[]');
  if(!imgUrl && allImgs.length>0) imgUrl=allImgs[0];
  if(!imgUrl){ alert('Add Image URL or select gallery photos'); return; }
  let obj={ name:document.getElementById('pName').value, price:document.getElementById('pPrice').value, oldprice:document.getElementById('pOldPrice').value, img:imgUrl, imgs:allImgs.length?allImgs:[imgUrl], cat:document.getElementById('pCat').value, sizes:JSON.parse(document.getElementById('pSizes').value||'[]') };
  if(!obj.name ||!obj.price){ alert('Name & Price required'); return; }
  products.push(obj);
  localStorage.setItem('myProducts',JSON.stringify(products));
  localStorage.setItem('stylenest_products',JSON.stringify(products));
  alert('Product Added ✅');
  showProducts();
  document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pOldPrice').value=''; document.getElementById('pImageURL').value=''; document.getElementById('pAllImages').value=''; document.getElementById('prevBox').innerHTML=''; document.getElementById('pSizes').value=''; document.querySelectorAll('.sz').forEach(c=>c.checked=false); document.getElementById('sizeShow').innerText='';
}
function showProducts(){
  let h=''; products.slice().reverse().forEach((p,i)=>{
    let idx=products.length-1-i;
    h+=`<div class="productItem"><img src="${p.img}"><div style="flex:1"><b>${p.name}</b><br><span style="font-size:12px">₹${p.price} • ${p.cat} ${p.sizes && p.sizes.length?' • Size:'+p.sizes.join(','):''}</span></div><button class="delBtn" onclick="delProd(${idx})">Delete</button></div>`;
  });
  document.getElementById('productList').innerHTML=h;
}
function delProd(i){ if(confirm('Delete?')){ products.splice(i,1); localStorage.setItem('myProducts',JSON.stringify(products)); localStorage.setItem('stylenest_products',JSON.stringify(products)); showProducts(); } }
loadOrders(); showProducts();
</script>
</body>
</html>
